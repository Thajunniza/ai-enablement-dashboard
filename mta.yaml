_schema-version: 3.3.0
ID: aiEnablementDashboard
description: AI Enablement Dashboard - monitors AI initiative adoption (starting with
  Joule for Consultants)
version: 1.0.0
modules:
  # ------------------------- DB DEPLOYER MODULE ---------------
  - name: aiEnablementDashboard-db-deployer
  # ------------------------------------------------------------
    type: nodejs
    path: gen/pg
    requires:
      - name: aiEnablementDashboard-db
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
      - command: npm start
        name: deploy-to-postgresql

  # --------------------- SERVER MODULE ------------------------
  - name: aiEnablementDashboard-srv
  # ------------------------------------------------------------  
    type: nodejs
    path: gen/srv
    requires:
      - name: aiEnablementDashboard-db
      - name: aiEnablementDashboard-auth
      - name: aiEnablementDashboard-destination
      - name: aiEnablementDashboard-jobscheduler
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-http-endpoint: /health
      readiness-health-check-type: http
    build-parameters:
      builder: npm

  # -------------------- DESTINATION CONTENT--------------------
  - name: aiEnablementDashboard-destination-content
  # ------------------------------------------------------------   
    type: com.sap.application.content
    requires:
      - name: srv-api
      - name: aiEnablementDashboard-destination
        parameters:
          content-target: true
          service-key:
            name: aiEnablementDashboard-destination-key
      - name: aiEnablementDashboard-html5-repo-host
        parameters:
          service-key:
            name: aiEnablementDashboard-html5-repo-host-key
      - name: aiEnablementDashboard-auth
        parameters:
          service-key:
            name: aiEnablementDashboard-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: aiEnablementDashboard-html5-repo-host
              ServiceInstanceName: aiEnablementDashboard-html5-repo-host
              ServiceKeyName: aiEnablementDashboard-html5-repo-host-key
              sap.cloud.service: aiEnablementDashboard
            - Authentication: OAuth2UserTokenExchange
              Name: aiEnablementDashboard_aiEnablementDashboard_auth
              ServiceInstanceName: aiEnablementDashboard-auth
              ServiceKeyName: aiEnablementDashboard-auth-key
              sap.cloud.service: aiEnablementDashboard
            - Authentication: OAuth2UserTokenExchange
              Name: aiEnablementDashboard-srv-api
              TokenServiceInstanceName: aiEnablementDashboard-auth
              TokenServiceKeyName: aiEnablementDashboard-auth-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: cpapp.service  
          existing_destinations_policy: update
    build-parameters:
      no-source: true

 # ------------------ APPLICATION CONTENT ---------------------
  - name: aiEnablementDashboard-app-content
  # ------------------------------------------------------------   
    type: com.sap.application.content
    path: .
    requires:
      - name: aiEnablementDashboard-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comsapaiinitiativesoverview.zip
          name: comsapaiinitiativesoverview
          target-path: resources/
  - name: comsapaiinitiativesoverview
    type: html5
    path: app/aiinitiativesoverview
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  # ------------------------- DB  MODULE ------------------------
  - name: aiEnablementDashboard-db
  # ------------------------------------------------------------  
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: postgresql-test
      
  # ----------------------- UAA SERVICE ------------------------
  - name: aiEnablementDashboard-auth
  # ------------------------------------------------------------   
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: aiEnablementDashboard-auth
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

# -------------------HTML 5 Repo Host-------------------------
  - name: aiEnablementDashboard-html5-repo-host
# ------------------------------------------------------------  
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

# -------------------Job Scheduler-------------------------  
  - name: aiEnablementDashboard-jobscheduler
# ------------------------------------------------------------
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: jobscheduler-test

# -------------------- DESTINATION SERVICE -------------------
  - name: aiEnablementDashboard-destination
# ------------------------------------------------------------   
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
      service: destination
      service-name: aiEnablementDashboard-destination-service
      service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production