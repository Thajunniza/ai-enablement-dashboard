_schema-version: '3.3'
ID: ai-enablement-dashboard
version: 1.0.0
description: "AI Enablement Dashboard - monitors AI initiative adoption (starting with Joule for Consultants)"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:
  # ---------------------------------------------------------------- CAP service
  - name: ai-enablement-dashboard-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: ai-enablement-dashboard-auth
      - name: ai-enablement-dashboard-db
      - name: ai-enablement-dashboard-jobscheduler
      - name: ai-enablement-dashboard-destination

  - name: ai-enablement-dashboard-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: ai-enablement-dashboard-db
resources:
  # ---------------------------------------------------------------- XSUAA
  - name: ai-enablement-dashboard-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ---------------------------------------------------------------- PostgreSQL 
  - name: ai-enablement-dashboard-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: postgresql-test

  # ---------------------------------------------------------------- Job Scheduling 
  - name: ai-enablement-dashboard-jobscheduler
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: jobscheduler-test
  
  # -------------------------------------------------------
  - name: ai-enablement-dashboard-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite