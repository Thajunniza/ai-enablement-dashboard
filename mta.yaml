_schema-version: '3.3'
ID: ai-enablement-dashboard
version: 1.0.0
description: "AI Enablement Dashboard - monitors AI initiative adoption (starting with Joule for Consultants)"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:
  # ---------------------------------------------------------------- CAP service
  - name: ai-enablement-dashboard-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: ai-enablement-dashboard-auth
      - name: ai-enablement-dashboard-db

  # (html5-apps-repo app-host / app-content / destination-content modules go here
  #  once you've run `cds add html5-repo` and `cds add destination` - merge their
  #  generated fragments in rather than me hand-writing them)

resources:
  # ---------------------------------------------------------------- XSUAA
  - name: ai-enablement-dashboard-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ---------------------------------------------------------------- PostgreSQL (your existing instance)
  - name: ai-enablement-dashboard-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: postgresql-test

  # (html5-apps-repo host + destination service resources go here too, from the same commands)